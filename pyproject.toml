[project]
name = "dollygrip"
version = "0.4.0"
description = "A local REST gateway for the DaVinci Resolve scripting API - give any HTTP client (or AI agent) a grip on your edit."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Shwetank" }]
keywords = ["davinci-resolve", "video-editing", "automation", "rest-api", "gateway", "nle", "post-production"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.27",
]

[project.urls]
Homepage = "https://github.com/thedumbstuff/dollygrip"
Issues = "https://github.com/thedumbstuff/dollygrip/issues"

[project.scripts]
dollygrip = "dollygrip.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.2 ; python_full_version >= '3.10'",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dollygrip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
